<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="GMT-4" />
  <title>MFB App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    function showTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(tab).classList.remove('hidden');
      document.getElementById('sidebar').classList.add('hidden');
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('hidden');
    }
  </script>
</head>

<body class="flex flex-col md:flex-row bg-gray-100 h-screen text-gray-800">

  <!-- Sidebar toggle for mobile -->
  <button class="md:hidden m-2 text-indigo-600 font-bold" onclick="toggleSidebar()">☰ Menu</button>

  <!-- Sidebar -->
  <aside id="sidebar" class="hidden md:block w-full md:w-64 bg-white shadow-xl p-6 space-y-6">
    <h2 class="text-xl font-bold">📊 MFB</h2>
    <nav class="space-y-3">
      <button onclick="showTab('tab1')"
        class="w-full text-left px-3 py-2 rounded-lg bg-indigo-100 hover:bg-indigo-200">1. Upload a Bet Slip</button>
      <button onclick="showTab('tab2')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-indigo-100">2. Check
        Balance</button>
      <button onclick="showTab('tab3')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-indigo-100">3. View This
        Week's Bets</button>
    </nav>
  </aside>

  <!-- Content -->
  <main class="flex-1 p-4 overflow-y-auto">
    <!-- Tab 1 -->
    <div id="tab1" class="tab-content">
      <div class="bg-white p-6 rounded-2xl shadow-lg max-w-lg mx-auto">
        <h1 class="text-2xl font-bold mb-6">Upload a Bet Slip</h1>
        <form id="uploadForm" class="space-y-4">
          <div>
            <label for="name" class="block mb-1 text-sm font-medium">Your Name</label>
            <input type="text" id="name" name="name" required class="w-full p-2 border rounded-lg bg-blue-50" />
          </div>
          <div>
            <label for="screenshot" class="block mb-1 text-sm font-medium">Screenshot</label>
            <input type="file" id="screenshot" name="screenshot" accept="image/*" required
              class="w-full p-2 border rounded-lg bg-white" />
          </div>
          <div>
            <label class="inline-flex items-center space-x-2">
              <input type="checkbox" name="freeplay" id="freeplay" class="accent-indigo-600 w-4 h-4" />
              <span class="text-sm font-medium text-gray-700">Use Freeplay</span>
            </label>
          </div>
          <button type="submit"
            class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold">Upload</button>
        </form>
        <div id="output" class="mt-6 text-sm text-left"></div>
      </div>
    </div>

    <!-- Tab 2 -->
    <div id="tab2" class="tab-content hidden">
      <div class="bg-white p-6 rounded-xl shadow space-y-4 max-w-lg mx-auto">
        <h2 class="text-xl font-semibold mb-4 text-indigo-600">💰 Your Balance</h2>
        <div>
          <label for="balance-name" class="block text-sm font-medium">Enter Your Name</label>
          <input type="text" id="balance-name" class="w-full p-2 border rounded-lg bg-blue-50" />
        </div>
        <div id="balance-output" class="mt-6 hidden space-y-4">
          <p class="text-lg font-medium">Balance: <span id="owed-value" class="text-green-600"></span></p>
          <p class="text-lg font-medium">Free Play: <span id="cashback-value" class="text-green-600"></span></p>
        </div>
        <button id="check-balance"
          class="mt-4 w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold">Check
          Balance</button>
      </div>
    </div>

    <!-- Tab 3 -->
    <div id="tab3" class="tab-content hidden">
      <div class="bg-white p-6 rounded-xl shadow max-w-2xl mx-auto">
        <h2 class="text-xl font-semibold mb-4 text-indigo-600">📅 This Week's Bets</h2>

        <div class="mb-4">
          <label for="weekly-name-input" class="block mb-1 text-sm font-medium text-gray-700">Enter Your Name</label>
          <input type="text" id="weekly-name-input" class="w-full p-2 border rounded-lg bg-blue-50"
            placeholder="e.g., Mason" />
          <button onclick="fetchWeeklyBets()"
            class="mt-2 w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold">View
            Bets</button>
        </div>

        <div id="weekly-bets-output" class="space-y-4 mt-6"></div>
      </div>
    </div>


    <script>
      const form = document.getElementById("uploadForm");
      const output = document.getElementById("output");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        output.innerHTML = "<div class='text-gray-500'>⏳ Uploading...</div>";

        const formData = new FormData(form);

        try {
          const response = await fetch("https://mfb-backend2.onrender.com/upload", {
            method: "POST",
            body: formData
          });

          const data = await response.json();

          if (response.ok) {
            const result = data.data;

            const wager = result.markdown?.match(/\*\*Wager:\*\*\s*\$?([\d.]+)/)?.[1] || "N/A";
            const odds = result.markdown?.match(/\*\*Odds:\*\*\s*([+−\-]?\d+)/)?.[1] || "N/A";
            const payout = result.markdown?.match(/\*\*Payout:\*\*\s*\$?([\d.]+)/)?.[1] || "N/A";

            output.innerHTML = `
            <div class="text-green-600 font-medium mb-2">✅ Upload successful!</div>
            <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 space-y-1">
              <p>📅 <strong>Timestamp:</strong> ${result.timestamp}</p>
              <p>🙋 <strong>Name:</strong> ${result.name}</p>
              <p>💸 <strong>Wager:</strong> ${wager}</p>
              <p>📈 <strong>Odds:</strong> ${odds}</p>
              <p>💰 <strong>Payout:</strong> ${payout}</p>
              ${result.image_link ? `<p><a href="${result.image_link}" target="_blank" class="text-indigo-600 underline mt-2 inline-block">🔗 View Image</a></p>` : ""}
            </div>`;
          } else {
            output.innerHTML = `<div class="text-red-600 font-medium">❌ Error: ${data.error || "Unknown error"}</div>`;
          }
        } catch (err) {
          output.innerHTML = `<div class="text-red-600 font-medium">❌ Request failed: ${err.message}</div>`;
        }
      });

      document.getElementById('check-balance').addEventListener('click', async () => {
        const name = document.getElementById('balance-name').value.trim();

        if (!name) {
          alert('Please enter your name.');
          return;
        }

        const res = await fetch(`https://mfb-backend2.onrender.com/balance?name=${encodeURIComponent(name)}`);
        const data = await res.json();

        const balanceOutput = document.getElementById('balance-output');
        const owedValue = document.getElementById('owed-value');
        const cashbackValue = document.getElementById('cashback-value');

        if (res.ok) {
          owedValue.textContent = `$${data.owed_owe_me}`;
          cashbackValue.textContent = `$${data.cashback}`;
          balanceOutput.classList.remove('hidden');
        } else {
          alert(data.error || 'Error fetching balance.');
        }
      });

      showTab('tab1');
      async function fetchWeeklyBets() {
        const name = document.getElementById("weekly-name-input").value.trim();
        const container = document.getElementById("weekly-bets-output");
        container.innerHTML = "";

        if (!name) {
          alert("Please enter your name.");
          return;
        }

        try {
          const res = await fetch(`https://mfb-backend2.onrender.com/weekly-bets?name=${encodeURIComponent(name)}`);
          const data = await res.json();

          if (res.ok && data.bets.length > 0) {
            data.bets.reverse().forEach(row => {
              const [timestamp, user, markdown, imageLink, method] = row;

              const card = document.createElement("div");
              card.className = "border border-gray-200 rounded-xl p-4 bg-gray-50 shadow-sm";

              card.innerHTML = `
          <p class="text-sm text-gray-500">${timestamp}</p>
          <p class="font-semibold text-gray-800">${user}</p>
          <div class="text-sm mt-2 whitespace-pre-line">${markdown || "(no bet details)"}</div>
          <p class="text-xs text-indigo-600 mt-1 italic">${method || "Method: Unknown"}</p>
          ${imageLink && imageLink !== "ERROR" ? `<a href="${imageLink}" target="_blank" class="inline-block mt-2 text-indigo-600 underline">📸 View Screenshot</a>` : ""}
        `;

              container.appendChild(card);
            });
          } else {
            container.innerHTML = `<p class="text-gray-500 text-sm">No bets found for "${name}".</p>`;
          }
        } catch (err) {
          container.innerHTML = `<p class="text-red-600 font-medium">❌ Error loading bets: ${err.message}</p>`;
        }
      }

    </script>
</body>

</html>
