<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MFB App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    function showTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(tabId).classList.remove('hidden');
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('hidden');
    }
  </script>
</head>
<body class="bg-gray-100 text-gray-800">
  <div class="flex flex-col md:flex-row h-screen">

    <!-- Sidebar -->
    <aside id="sidebar" class="md:w-64 bg-white shadow-lg p-4 space-y-4 hidden md:block">
      <h2 class="text-xl font-bold">📊 MFB</h2>
      <nav class="space-y-2">
        <button onclick="showTab('tab1')" class="w-full text-left px-3 py-2 rounded-lg bg-indigo-100 hover:bg-indigo-200">1. Upload a Bet Slip</button>
        <button onclick="showTab('tab2')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-indigo-100">2. Check Balance</button>
        <button onclick="showTab('tab3')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-indigo-100">3. View This Week's Bets</button>
      </nav>
    </aside>

    <!-- Mobile menu button -->
    <button class="md:hidden p-4 bg-indigo-600 text-white" onclick="toggleSidebar()">☰ Menu</button>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-6 space-y-6">
      <!-- Tab 1 -->
      <div id="tab1" class="tab-content">
        <div class="bg-white p-6 rounded-xl shadow max-w-lg mx-auto">
          <h1 class="text-2xl font-bold mb-4">Upload a Bet Slip</h1>
          <form id="uploadForm" class="space-y-4">
            <div>
              <label for="name" class="block text-sm font-medium mb-1">Your Name</label>
              <input type="text" id="name" name="name" required class="w-full p-2 border rounded-lg bg-blue-50" />
            </div>
            <div>
              <label for="screenshot" class="block text-sm font-medium mb-1">Screenshot</label>
              <input type="file" id="screenshot" name="screenshot" accept="image/*" required class="w-full p-2 border rounded-lg bg-white" />
            </div>
            <button type="submit" class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold">Upload</button>
          </form>
          <div id="output" class="mt-6 text-sm text-left"></div>
        </div>
      </div>

      <!-- Tab 2 -->
      <div id="tab2" class="tab-content hidden">
        <div class="bg-white p-6 rounded-xl shadow max-w-lg mx-auto">
          <h2 class="text-xl font-semibold mb-4 text-indigo-600">💰 Your Balance</h2>
          <label for="balance-name" class="block text-sm font-medium mb-1">Enter Your Name</label>
          <input type="text" id="balance-name" class="w-full p-2 border rounded-lg bg-blue-50 mb-4" />
          <button id="check-balance" class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold">
            Check Balance
          </button>
          <div id="balance-output" class="mt-6 hidden space-y-2">
            <p class="text-lg font-medium">Owed / Owe Me: <span id="owed-value" class="text-red-600"></span></p>
            <p class="text-lg font-medium">Cashback: <span id="cashback-value" class="text-green-600"></span></p>
          </div>
        </div>
      </div>

      <!-- Tab 3 -->
      <div id="tab3" class="tab-content hidden">
        <div class="bg-white p-6 rounded-xl shadow text-center text-gray-500 max-w-lg mx-auto">
          <h2 class="text-xl font-semibold mb-2">📅 This Week's Bets</h2>
          <p>Coming soon...</p>
        </div>
      </div>
    </main>
  </div>

  <!-- JS -->
  <script>
    const form = document.getElementById("uploadForm");
    const output = document.getElementById("output");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      output.innerHTML = "<div class='text-gray-500'>⏳ Uploading...</div>";

      const formData = new FormData(form);

      try {
        const response = await fetch("https://mfb-backend2.onrender.com/upload", {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        if (response.ok) {
          const result = data.data;

          const wager = result.markdown?.match(/\*\*Wager:\*\*\s*\$?([\d.]+)/)?.[1] || "N/A";
          const odds = result.markdown?.match(/\*\*Odds:\*\*\s*([+−\-]?\d+)/)?.[1] || "N/A";
          const payout = result.markdown?.match(/\*\*Payout:\*\*\s*\$?([\d.]+)/)?.[1] || "N/A";

          output.innerHTML = `
            <div class="text-green-600 font-medium mb-2">✅ Upload successful!</div>
            <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 space-y-2">
              <p>📅 <strong>Timestamp:</strong> ${result.timestamp}</p>
              <p>🙋 <strong>Name:</strong> ${result.name}</p>
              <p>💸 <strong>Wager:</strong> ${wager}</p>
              <p>📈 <strong>Odds:</strong> ${odds}</p>
              <p>💰 <strong>Payout:</strong> ${payout}</p>
              ${result.image_link ? `<p><a href="${result.image_link}" target="_blank" class="text-indigo-600 underline mt-2 inline-block">🔗 View Image</a></p>` : ""}
            </div>`;
        } else {
          output.innerHTML = `<div class="text-red-600 font-medium">❌ Error: ${data.error || "Unknown error"}</div>`;
        }
      } catch (err) {
        output.innerHTML = `<div class="text-red-600 font-medium">❌ Request failed: ${err.message}</div>`;
      }
    });

    document.getElementById('check-balance').addEventListener('click', async () => {
      const name = document.getElementById('balance-name').value.trim();

      if (!name) {
        alert('Please enter your name.');
        return;
      }

      const res = await fetch(`https://mfb-backend2.onrender.com/balance?name=${encodeURIComponent(name)}`);
      const data = await res.json();

      const balanceOutput = document.getElementById('balance-output');
      const owedValue = document.getElementById('owed-value');
      const cashbackValue = document.getElementById('cashback-value');

      if (res.ok) {
        owedValue.textContent = `$${data.owed_owe_me}`;
        cashbackValue.textContent = `$${data.cashback}`;
        balanceOutput.classList.remove('hidden');
      } else {
        alert(data.error || 'Error fetching balance.');
      }
    });

    showTab('tab1');
  </script>
</body>
</html>
