
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MFB App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    function showTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(tab).classList.remove('hidden');
    }

    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      sidebar.classList.toggle("hidden");
    }
  </script>
</head>
<body class="flex flex-col md:flex-row bg-gray-100 h-screen text-gray-800">
  <!-- Toggle Button -->
  <button onclick="toggleSidebar()" class="md:hidden p-4 bg-indigo-600 text-white font-bold">
    ☰ Menu
  </button>

  <!-- Sidebar -->
  <aside id="sidebar" class="w-full md:w-64 bg-white shadow-xl p-6 space-y-6 hidden md:block">
    <h2 class="text-xl font-bold">📊 MFB</h2>
    <nav class="space-y-3">
      <button onclick="showTab('tab1')" class="w-full text-left px-3 py-2 rounded-lg bg-indigo-100 hover:bg-indigo-200">1. Upload a Bet Slip</button>
      <button onclick="showTab('tab2')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-indigo-100">2. Check Balance</button>
      <button onclick="showTab('tab3')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-indigo-100">3. View This Week's Bets</button>
    </nav>
  </aside>

  <!-- Content -->
  <main class="flex-1 p-6 overflow-y-auto">
    <!-- Tab 1 -->
    <div id="tab1" class="tab-content">
      <div class="bg-white p-8 rounded-2xl shadow-lg max-w-lg mx-auto">
        <h1 class="text-2xl font-bold mb-6">Upload a Bet Slip</h1>
        <form id="uploadForm" class="space-y-4">
          <div class="text-left">
            <label for="name" class="block mb-1 text-sm font-medium">Your Name</label>
            <input type="text" id="name" name="name" required class="w-full p-2 border rounded-lg bg-blue-50" />
          </div>
          <div class="text-left">
            <label for="screenshot" class="block mb-1 text-sm font-medium">Screenshot</label>
            <input type="file" id="screenshot" name="screenshot" accept="image/*" required class="w-full p-2 border rounded-lg bg-white" />
          </div>
          <button type="submit" class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold">Upload</button>
        </form>
        <div id="output" class="mt-6 text-sm text-left"></div>
      </div>
    </div>

    <!-- Tab 2 -->
    <div id="tab2" class="tab-content hidden">
      <div class="bg-white p-6 rounded-xl shadow space-y-4 max-w-lg mx-auto">
        <h2 class="text-xl font-semibold mb-4 text-indigo-600">💰 Your Balance</h2>
        <label for="balance-name" class="block text-sm font-medium">Enter Your Name</label>
        <input type="text" id="balance-name" class="w-full p-2 border rounded-lg bg-blue-50" />
        <div id="balance-output" class="mt-6 hidden space-y-4">
          <p class="text-lg font-medium">Owed / Owe Me: <span id="owed-value" class="text-red-600"></span></p>
          <p class="text-lg font-medium">Cashback: <span id="cashback-value" class="text-green-600"></span></p>
        </div>
        <button id="check-balance" class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold">
          Check Balance
        </button>
      </div>
    </div>

    <!-- Tab 3 -->
    <div id="tab3" class="tab-content hidden">
      <div class="bg-white p-6 rounded-xl shadow max-w-2xl mx-auto">
        <h2 class="text-xl font-semibold mb-4 text-indigo-600">📅 This Week's Bets</h2>
        <label for="bets-name" class="block text-sm font-medium">Enter Your Name</label>
        <input type="text" id="bets-name" class="w-full p-2 border rounded-lg bg-blue-50 mb-4" />
        <button id="check-bets" class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold mb-4">View My Bets</button>
        <div id="bets-output" class="space-y-2"></div>
      </div>
    </div>
  </main>

  <script>
    showTab('tab1');

    const form = document.getElementById("uploadForm");
    const output = document.getElementById("output");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      output.innerHTML = "<div class='text-gray-500'>⏳ Uploading...</div>";
      const formData = new FormData(form);
      try {
        const response = await fetch("https://mfb-backend2.onrender.com/upload", {
          method: "POST",
          body: formData
        });
        const data = await response.json();
        if (response.ok) {
          const result = data.data;
          output.innerHTML = `
            <div class="text-green-600 font-medium mb-2">✅ Upload successful!</div>
            <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
              <p><strong>📅 Timestamp:</strong> ${result.timestamp}</p>
              <p><strong>🙋 Name:</strong> ${result.name}</p>
              <p><strong>💸 Wager:</strong> ${result.markdown?.match(/\*\*Wager:\*\* \$(\d+(\.\d+)?)/)?.[1] || "N/A"}</p>
              <p><strong>📈 Odds:</strong> ${result.markdown?.match(/\*\*Odds:\*\* ([+−\-]?\d+)/)?.[1] || "N/A"}</p>
              <p><strong>💰 Payout:</strong> ${result.markdown?.match(/\*\*Payout:\*\* \$(\d+(\.\d+)?)/)?.[1] || "N/A"}</p>
              ${result.image_link ? `<p><a href="${result.image_link}" target="_blank" class="text-indigo-600 underline mt-2 inline-block">🔗 View Image</a></p>` : ""}
            </div>`;
        } else {
          output.innerHTML = `<div class="text-red-600 font-medium">❌ Error: ${data.error || "Unknown error"}</div>`;
        }
      } catch (err) {
        output.innerHTML = `<div class="text-red-600 font-medium">❌ Request failed: ${err.message}</div>`;
      }
    });

    document.getElementById('check-balance').addEventListener('click', async () => {
      const name = document.getElementById('balance-name').value.trim();
      if (!name) return alert('Please enter your name.');
      const res = await fetch(\`https://mfb-backend2.onrender.com/balance?name=\${encodeURIComponent(name)}\`);
      const data = await res.json();
      if (res.ok) {
        document.getElementById('owed-value').textContent = `$${data.owed_owe_me}`;
        document.getElementById('cashback-value').textContent = `$${data.cashback}`;
        document.getElementById('balance-output').classList.remove('hidden');
      } else {
        alert(data.error || 'Error fetching balance.');
      }
    });

    document.getElementById('check-bets').addEventListener('click', async () => {
      const name = document.getElementById('bets-name').value.trim();
      if (!name) return alert('Please enter your name.');
      const res = await fetch(\`https://mfb-backend2.onrender.com/weekly-bets?name=\${encodeURIComponent(name)}\`);
      const data = await res.json();
      const output = document.getElementById('bets-output');
      output.innerHTML = '';
      if (res.ok) {
        if (data.bets.length === 0) {
          output.innerHTML = '<p class="text-gray-500">No bets found for this week.</p>';
        } else {
          data.bets.forEach(row => {
            output.innerHTML += `<div class="bg-gray-50 p-3 rounded-lg border">${row.join(' | ')}</div>`;
          });
        }
      } else {
        output.innerHTML = `<p class="text-red-600 font-medium">❌ ${data.error}</p>`;
      }
    });
  </script>
</body>
</html>
