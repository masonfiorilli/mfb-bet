<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MFB App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    function showTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(tab).classList.remove('hidden');
      document.getElementById('sidebar').classList.add('hidden');
    }
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('hidden');
    }
  </script>
</head>
<body class="flex flex-col sm:flex-row bg-gray-100 min-h-screen text-gray-800">
  <!-- Toggle Button (Mobile) -->
  <div class="sm:hidden p-4 bg-indigo-600 text-white flex justify-between items-center">
    <h1 class="font-bold text-lg">MFB</h1>
    <button onclick="toggleSidebar()" class="px-3 py-1 bg-white text-indigo-600 rounded">☰ Menu</button>
  </div>

  <!-- Sidebar -->
  <aside id="sidebar" class="hidden sm:block w-full sm:w-64 bg-white shadow-xl p-6 space-y-6">
    <h2 class="text-xl font-bold">📊 MFB</h2>
    <nav class="space-y-3">
      <button onclick="showTab('tab1')" class="w-full text-left px-3 py-2 rounded-lg bg-indigo-100 hover:bg-indigo-200">1. Upload a Bet Slip</button>
      <button onclick="showTab('tab2')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-indigo-100">2. Check Balance</button>
      <button onclick="showTab('tab3')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-indigo-100">3. View This Week's Bets</button>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 p-4 sm:p-6 overflow-y-auto">
    <!-- Tab 1 -->
    <div id="tab1" class="tab-content">
      <div class="bg-white p-6 rounded-xl shadow max-w-md mx-auto">
        <h1 class="text-xl font-bold mb-4">Upload a Bet Slip</h1>
        <form id="uploadForm" class="space-y-4">
          <div>
            <label for="name" class="block mb-1 text-sm font-medium">Your Name</label>
            <input type="text" id="name" name="name" required class="w-full p-2 border rounded bg-blue-50" />
          </div>
          <div>
            <label for="screenshot" class="block mb-1 text-sm font-medium">Screenshot</label>
            <input type="file" id="screenshot" name="screenshot" accept="image/*" required class="w-full p-2 border rounded bg-white" />
          </div>
          <button type="submit" class="w-full py-2 bg-indigo-600 text-white rounded font-semibold">Upload</button>
        </form>
        <div id="output" class="mt-6 text-sm"></div>
      </div>
    </div>

    <!-- Tab 2 -->
    <div id="tab2" class="tab-content hidden">
      <div class="bg-white p-6 rounded-xl shadow max-w-md mx-auto space-y-4">
        <h2 class="text-xl font-semibold text-indigo-600">💰 Your Balance</h2>
        <div>
          <label for="balance-name" class="block text-sm font-medium">Enter Your Name</label>
          <input type="text" id="balance-name" class="w-full p-2 border rounded bg-blue-50" />
        </div>
        <div id="balance-output" class="hidden space-y-2">
          <p>Owed / Owe Me: <span id="owed-value" class="text-red-600 font-medium"></span></p>
          <p>Cashback: <span id="cashback-value" class="text-green-600 font-medium"></span></p>
        </div>
        <button id="check-balance" class="w-full py-2 bg-indigo-600 text-white rounded font-semibold">Check Balance</button>
      </div>
    </div>

    <!-- Tab 3 -->
    <div id="tab3" class="tab-content hidden">
      <div class="bg-white p-6 rounded-xl shadow text-center max-w-md mx-auto">
        <h2 class="text-xl font-semibold">📅 This Week's Bets</h2>
        <p class="text-gray-500 mt-2">Coming soon...</p>
      </div>
    </div>
  </main>

  <!-- Script -->
  <script>
    const form = document.getElementById("uploadForm");
    const output = document.getElementById("output");

    form?.addEventListener("submit", async (e) => {
      e.preventDefault();
      output.innerHTML = "<div class='text-gray-500'>⏳ Uploading...</div>";
      const formData = new FormData(form);
      try {
        const res = await fetch("https://mfb-backend2.onrender.com/upload", { method: "POST", body: formData });
        const data = await res.json();
        if (res.ok) {
          const r = data.data;
          output.innerHTML = `
            <div class="text-green-600 font-medium mb-2">✅ Upload successful!</div>
            <div class="bg-gray-50 p-4 rounded border">
              <p><strong>📅 Timestamp:</strong> ${r.timestamp}</p>
              <p><strong>🙋 Name:</strong> ${r.name}</p>
              <p><strong>💸 Wager:</strong> ${r.markdown.match(/\\*\\*Wager:\\*\\* \\$(\\d+(\\.\\d+)?)/)?.[1] || 'N/A'}</p>
              <p><strong>📈 Odds:</strong> ${r.markdown.match(/\\*\\*Odds:\\*\\* ([+−\\-]?\\d+)/)?.[1] || 'N/A'}</p>
              <p><strong>💰 Payout:</strong> ${r.markdown.match(/\\*\\*Payout:\\*\\* \\$(\\d+(\\.\\d+)?)/)?.[1] || 'N/A'}</p>
              ${r.image_link ? `<p><a href='${r.image_link}' target='_blank' class='text-indigo-600 underline mt-2 inline-block'>🔗 View Image</a></p>` : ""}
            </div>`;
        } else {
          output.innerHTML = `<div class="text-red-600 font-medium">❌ Error: ${data.error || 'Unknown error'}</div>`;
        }
      } catch (err) {
        output.innerHTML = `<div class="text-red-600 font-medium">❌ Request failed: ${err.message}</div>`;
      }
    });

    document.getElementById('check-balance')?.addEventListener('click', async () => {
      const name = document.getElementById('balance-name').value.trim();
      if (!name) return alert('Please enter your name.');
      const res = await fetch(`https://mfb-backend2.onrender.com/balance?name=${name}`);
      const data = await res.json();
      const out = document.getElementById('balance-output');
      const owed = document.getElementById('owed-value');
      const cashback = document.getElementById('cashback-value');
      if (res.ok) {
        owed.textContent = `$${data.owed_owe_me}`;
        cashback.textContent = `$${data.cashback}`;
        out.classList.remove('hidden');
      } else {
        alert(data.error || 'Error fetching balance.');
      }
    });

    showTab('tab1');
  </script>
</body>
</html>
